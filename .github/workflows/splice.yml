name: splice

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: splice-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs right after checkout: untracked files from earlier steps would be committed.
      - uses: keelstackhq/splice/action@v1
        with:
          scope: all
          # GITHUB_TOKEN works, but its pushes and PRs do not trigger CI.
          token: ${{ secrets.SPLICE_BOT_TOKEN || github.token }}
